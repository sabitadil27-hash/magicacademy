<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Magic Academy</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="game">

<h1>🧙 Magic Academy</h1>
<p class="subtitle">Become the strongest wizard!</p>

<div class="stats">
<div>💜 <span id="mana">0</span></div>
<div>⚡ <span id="energy">100</span></div>
<div>🪙 <span id="gold">0</span></div>
</div>

<div class="xp">
<div id="xpBar"></div>
</div>

<h2>Level <span id="level">1</span></h2>

<div class="monster">
<div id="monsterEmoji">👹</div>
<p>HP: <span id="monsterHP">100</span>/100</p>
</div>

<div class="crystal" onclick="tap()">
🔮
</div>

<div class="buttons">
<button onclick="castFireball()">🔥 Fireball</button>
<button onclick="dailyReward()">🎁 Daily Reward</button>
</div>

<div class="menu">
<button>🏠 Home</button>
<button>🎒 Bag</button>
<button>📖 Spells</button>
<button>🏆 Pass</button>
<button>👤 Profile</button>
</div>

</div>

<script src="script.js"></script>

</body>
</html>
